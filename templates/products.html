
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Store</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }

        h1 {
            margin-bottom: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f3f4f6;
        }

        tr:hover {
            background: #fafafa;
        }

        .price {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Computer Store</h1>
    <p>Computer peripherals and accessories</p>

    <h2>Product Catalog</h2>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Product</th>
                <th>Description</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            {{range .}}
            <tr>
                <td>{{.ProductID}}</td>
                <td>{{.Name}}</td>
                <td>{{.Description}}</td>
                <td class="price">{{.Price}} UAH</td>
            </tr>
            {{else}}
            <tr>
                <td colspan="4">No products available</td>
            </tr>
            {{end}}
        </tbody>
    </table>
</body>
</html>
